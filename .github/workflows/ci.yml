name: SmartMoney CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smartmoney-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smartmoney_ci
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      HELIUS_API_KEY: ci-placeholder-key
      ENVIRONMENT: test
      DEBUG: "false"
      ENABLE_DOCS: "true"
      CORS_ORIGINS: http://localhost:5173
      CORS_ALLOW_CREDENTIALS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m compileall -q backend
          python -m compileall -q alembic

      - name: Validate Alembic revisions
        run: alembic heads

      - name: Validate FastAPI imports
        run: |
          python -c "from backend.app.main import app; assert app.title == 'SmartMoney AI'; print('FastAPI import OK')"

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

      - name: Build production Docker image
        working-directory: .
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.example.com \
            --tag smartmoney-frontend-ci \
            ./frontend

  automation:
    name: Automation validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate automation JavaScript
        run: node --check automation/run.mjs

      - name: Validate automation package
        run: |
          node -e "JSON.parse(require('fs').readFileSync('automation/package.json', 'utf8')); console.log('Automation package.json OK')"

      - name: Validate Railway configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('automation/railway.json', 'utf8')); console.log('Automation railway.json OK')" 