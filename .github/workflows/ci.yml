name: SmartMoney CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smartmoney-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smartmoney_ci
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      HELIUS_API_KEY: ci-placeholder-key
      AUTOMATION_API_KEY: ci-automation-key-12345678901234567890
      PAPER_TRADING_API_KEY: ci-paper-key-123456789012345678901234
      LIVE_TRADING_API_KEY: ci-live-key-12345678901234567890123456
      JUPITER_API_KEY: ci-jupiter-placeholder
      ENVIRONMENT: test
      DEBUG: "false"
      LOG_LEVEL: INFO
      ENABLE_DOCS: "true"
      CORS_ORIGINS: http://localhost:5173
      CORS_ALLOW_CREDENTIALS: "true"
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend and migrations
        run: |
          python -m compileall -q backend
          python -m compileall -q alembic

      - name: Validate Alembic migration chain
        run: |
          alembic heads
          alembic upgrade head --sql > /tmp/smartmoney-migrations.sql
          test -s /tmp/smartmoney-migrations.sql

      - name: Validate FastAPI imports
        run: |
          python -c "from backend.app.main import app; assert app.title == 'SmartMoney AI'; print('FastAPI import OK')"

      - name: Validate worker imports
        run: |
          python -c "from backend.app.workers.helius_live_trading_worker import HeliusLiveTradingWorker; assert HeliusLiveTradingWorker; print('Helius worker import OK')"

      - name: Validate Railway configurations
        run: |
          python -c "import json; json.load(open('railway.json', encoding='utf-8')); json.load(open('railway.worker.json', encoding='utf-8')); print('Railway configs OK')"

      - name: Run backend test suite
        run: python -m pytest -q

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

      - name: Build production Docker image
        working-directory: .
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.example.com \
            --tag smartmoney-frontend-ci \
            ./frontend

  automation:
    name: Automation validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate automation JavaScript
        run: npm --prefix automation run check

      - name: Run automation test suite
        run: npm --prefix automation test

      - name: Validate Railway configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('automation/railway.json', 'utf8')); console.log('Automation railway.json OK')" 